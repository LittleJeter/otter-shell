    <title>Otter Shell — Threat Hunt Console</title>

      name="description"
      content="A test / portfolio project, not production security tooling. A defensive threat-hunt authoring and tracking console that generates SIEM/EDR hunt queries across seven platforms from ATT&CK techniques and CISA KEV data, tracks each hunt through a lifecycle with a findings journal, and exports to Sigma and Detection-as-Code."

    <meta property="og:site_name" content="Otter Shell" />
    <meta property="og:title" content="Otter Shell — Threat Hunt Console" />
    <meta
      property="og:description"
      content="A test / portfolio project. Author and track threat hunts across seven SIEM/EDR platforms: ATT&CK coverage mapping, CISA KEV scanning, Sigma round-trip, and a findings journal per hunt."

    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
